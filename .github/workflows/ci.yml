name: Mobile CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "Commit SHA to redeploy for rollback"
        required: false
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Dependency report
        run: flutter pub outdated
        continue-on-error: true
      - run: flutter analyze
      - name: Run Flutter tests if present
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No Flutter tests found"
          fi
      - name: Build debug APK
        run: flutter build apk --debug

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_sha != ''
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git checkout "${{ inputs.rollback_sha }}"
          echo "Rollback candidate checked out: ${{ inputs.rollback_sha }}"
          echo "Connect this step to the mobile release provider using protected environment secrets."
